- insert:
    - id: agent-control
      name: dsh-agent-control
      # 模型发起的重启是否要过一次审批：`ask`（缺省，走 DSH 审批卡片）| `auto`（免审批）。
      # host 端不 import schemastery，所以这个值由插件自己手工校验，未知值一律回退 `ask`
      # （见 docs/PLAN-hot-restart.md 3.4）。界面上的重启按钮不走审批：点按钮本身就是授权。
      config:
        approval: ask

    # 五个组件各占一行：插件列表里可以逐个开关（关掉 = 这一行被写成 `disabled: true`，
    # loader 不会 apply 它）。主入口只在「这个组件没有自己那一行」时才代装，所以关掉一行
    # 真的会让路由消失、界面入口也随之消失（见 src/host-wiring.mjs 的 hasOwnRow）。
    # ⚠️ 不要把主行的 id / name 改名：升级时 profile 里那条同 id 的行会失配。
    - id: agent-control-session
      name: dsh-agent-control/session
    - id: agent-control-turn
      name: dsh-agent-control/turn
    - id: agent-control-restart
      name: dsh-agent-control/restart
      # 模型发起的重启是否过一次审批：`ask`（缺省，走 DSH 审批卡片）| `auto`（免审批）。
      # 与主行同义：这一行自己写了就以它为准，没写则回退主行那一份（旧配置写在主行上）。
      config:
        approval: ask

    # 下面两行是两件事，各自一个独立开关：任务完成提醒（notify）与每轮花费（cost）。
    # host 端各只有一条只读探针（不注册 POST 路由、也没有模型工具），铃声与花费都在浏览器里。
    # 关掉其中一行不会影响另一行；两行同样受主行总闸约束：主行被关掉时它们的 fiber 停在
    # pending，对应入口都不会出现。
    - id: agent-control-notify
      name: dsh-agent-control/notify
    - id: agent-control-cost
      name: dsh-agent-control/cost
